name: Maven CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Maven clean & compile & test
        run: mvn clean compile test

  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) 登录阿里云 ACR
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 2) 构建并打 tag
      - name: Build & tag
        run: |
          docker build -t app:${{ github.sha }} .
          docker tag app:${{ github.sha }} \
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/app:${{ github.sha }}

      # 3) 推送
      - name: Push to ACR
        run: |
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/app:${{ github.sha }}

      # 4) 远程部署（ECS）
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker login -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}
            docker pull ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/app:${{ github.sha }}
            docker stop -f app || true
            docker rm -f app || true
            docker run -d --restart=always --name app -p 8090:8090 \
              ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/app:${{ github.sha }}